<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genius Q&A Finder</title>
  <style>
    :root {
      --genius-yellow: #ffff64;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-muted: #9e9e9e;
      --border: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    h1 {
      color: var(--genius-yellow);
      margin: 0 0 8px 0;
    }
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      outline: none;
    }
    input:focus { border-color: var(--genius-yellow); }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: var(--genius-yellow);
      color: #000;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .direct-link-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .direct-link {
      color: var(--genius-yellow);
      text-decoration: none;
      word-break: break-all;
    }
    .direct-link:hover { text-decoration: underline; }
    .copy-btn {
      padding: 4px 8px;
      font-size: 11px;
      background: #333;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #444; }
    .answer-body {
      font-size: 15px;
      line-height: 1.6;
      color: #ddd;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #2b2b2b;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 6px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Genius Q&A Direct Finder</h1>
  <div class="subtitle">Extract unlisted Q&As and direct permalinks via Song ID.</div>

  <div class="input-group">
    <input type="text" id="songIdInput" placeholder="Enter Genius Song ID (e.g. 1832400)" value="1832400" />
    <button onclick="fetchQuestions()">Get Q&A</button>
  </div>

  <div id="results"></div>
</div>

<script>
  async function fetchQuestions() {
    const songId = document.getElementById('songIdInput').value.trim();
    const resultsContainer = document.getElementById('results');

    if (!songId) {
      resultsContainer.innerHTML = '<div class="status-msg">Please enter a Song ID.</div>';
      return;
    }

    resultsContainer.innerHTML = '<div class="status-msg">Loading Q&A...</div>';

    try {
      // Calls your own backend route: zero CORS, zero blocking
      const res = await fetch(`/api/questions?song_id=${encodeURIComponent(songId)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const questions = data.response?.questions || [];
      if (questions.length === 0) {
        resultsContainer.innerHTML = '<div class="status-msg">No questions found for this song ID.</div>';
        return;
      }

      renderQuestions(questions);
    } catch (err) {
      resultsContainer.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Error: ${err.message}</div>`;
    }
  }

  function renderQuestions(questions) {
    const resultsContainer = document.getElementById('results');
    resultsContainer.innerHTML = '';

    questions.forEach(q => {
      const songPath = q.song?.path || `/${q.song_id}`;
      const directUrl = `https://genius.com${songPath}/questions/${q.id}`;

      let answersHtml = '';
      if (q.answers && q.answers.length > 0) {
        answersHtml = q.answers.map(ans => {
          let bodyHtml = ans.body?.html || (ans.body?.plain ? `<p>${escapeHtml(ans.body.plain)}</p>` : '<em>No text body</em>');

          // Embed YouTube videos if present in the answer
          const ytMatch = bodyHtml.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
          if (ytMatch) {
            bodyHtml += `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>`;
          }

          return `
            <div>
              <div class="answer-body">${bodyHtml}</div>
              <span class="badge">Answered by: ${escapeHtml(ans.user?.name || 'Contributor')}</span>
            </div>
          `;
        }).join('<hr style="border: 0; border-top: 1px dashed var(--border); margin: 16px 0;">');
      } else {
        answersHtml = '<em style="color: var(--text-muted);">No answers submitted yet.</em>';
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <h2 class="card-title">${escapeHtml(q.title || 'Untitled Question')}</h2>
          <div class="direct-link-container">
            <span>Direct Link:</span>
            <a href="${directUrl}" target="_blank" class="direct-link">${directUrl}</a>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${directUrl}').then(() => alert('Link copied!'))">Copy</button>
          </div>
        </div>
        <div>${answersHtml}</div>
      `;
      resultsContainer.appendChild(card);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  // Load default ID immediately on page open
  window.addEventListener('DOMContentLoaded', fetchQuestions);
</script>

</body>
</html>
